version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=todo_user
      - MYSQL_PASSWORD=todo_password
      - MYSQL_DB=todos
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=todos
      - MYSQL_USER=todo_user
      - MYSQL_PASSWORD=todo_password
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
